<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Game học từ vựng</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #e0f2fe, #fff7ed);
    text-align: center;
}

h1 {
    margin-top: 20px;
}

/* GAME */
.game {
    margin: 30px auto;
    padding: 25px;
    max-width: 400px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

#gameIcon {
    font-size: 100px;
    margin: 15px 0;
}

input {
    width: 80%;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #ccc;
    text-align: center;
}

button {
    padding: 10px 15px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

#result {
    font-size: 18px;
    margin-top: 10px;
}

.score {
    font-size: 20px;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>🎮 Game học tiếng Anh</h1>

<div class="game">
    <div id="gameIcon">👕</div>

    <input id="answer" placeholder="Nhập từ..." />

    <br>
    <button onclick="checkAnswer()">Kiểm tra</button>
    <button onclick="speak(currentWord)">🔊 Nghe</button>
    <button onclick="newQuestion()">➡️ Câu mới</button>

    <div id="result"></div>
    <div class="score">Điểm: <span id="score">0</span></div>
</div>

<script>
const words = [
{word:"shirts",icon:"👕"},
{word:"yogurt",icon:"🥣"},
{word:"tent",icon:"⛺"},
{word:"sliding",icon:"🛝"},
{word:"yams",icon:"🍠"},
{word:"yo-yos",icon:"🪀"},
{word:"driving cars",icon:"🚗"},
{word:"shoes",icon:"👟"},
{word:"grapes",icon:"🍇"},
{word:"riding bikes",icon:"🚴"},
{word:"teapot",icon:"🫖"},
{word:"zebra",icon:"🦓"},
{word:"cake",icon:"🎂"},
{word:"zoo",icon:"🦁"},
{word:"grandmother",icon:"👵"},
{word:"fourteen",icon:"14"},
{word:"shorts",icon:"🩳"},
{word:"fifteen",icon:"15"},
{word:"sister",icon:"👧"},
{word:"brother",icon:"👦"},
{word:"nineteen",icon:"19"},
{word:"thirteen",icon:"13"},
{word:"eleven",icon:"11"},
{word:"blanket",icon:"🛏️"}
];

let currentWord = "";
let score = 0;

// text to speech
function speak(text){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.8;
    speechSynthesis.speak(u);
}

// câu mới
function newQuestion(){
    const random = words[Math.floor(Math.random()*words.length)];
    currentWord = random.word;

    document.getElementById("gameIcon").innerText = random.icon;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";

    document.getElementById("answer").focus();
}

// kiểm tra
function checkAnswer(){
    const input = document.getElementById("answer").value.trim().toLowerCase();

    if(input === currentWord.toLowerCase()){
        score++;
        document.getElementById("score").innerText = score;
        document.getElementById("result").innerText = "✅ Giỏi quá!";
        setTimeout(newQuestion, 1000);
    } else {
        document.getElementById("result").innerText = "❌ Sai rồi, thử lại!";
    }
}

// Enter = kiểm tra
document.getElementById("answer").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        checkAnswer();
    }
});

// start
newQuestion();
</script>

</body>
</html>
